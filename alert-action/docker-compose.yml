services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: always
    user: "root"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-remote-write-receiver'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: always
    user: "root"
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"

  # ==========================================
  # Database Service (MariaDB)
  # ==========================================
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-tbcroot123@}
      MYSQL_DATABASE: ${DB_NAME:-proxmox_alerts}
      MYSQL_USER: ${DB_USER:-proxmox_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tbcadmin123@}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./alert-action/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================
  # Alert Action Bot & Dashboard Service
  # ==========================================
  alert-action:
    build:
      context: ./alert-action
      dockerfile: Dockerfile
    container_name: alert-action
    restart: always
    env_file:
      - ./alert-action/.env
    depends_on:
      mariadb:
        condition: service_healthy
      alertmanager:
        condition: service_started
    ports:
      - "5000:5000"
    environment:
      # Database connection inside Docker network
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-proxmox_alerts}
      - DB_USER=${DB_USER:-proxmox_user}
      - DB_PASSWORD=${DB_PASSWORD:-tbcadmin123@}
      # Alertmanager & Prometheus URLs (Direct container-to-container)
      - ALERTMANAGER_URL=http://alertmanager:9093
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
      - SLACK_CHANNEL=#warning-alerts
    volumes:
      - ./alert-action/app.py:/app/app.py
      - ./alert-action/dashboard.html:/app/dashboard.html:ro
      - ./alert-action/login.html:/app/login.html:ro
      - alert_action_data:/var/lib/alert-action
      - ./alert-action/logs:/var/log

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  mariadb_data:
  alert_action_data:
