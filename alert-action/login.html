<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promax – Sign In</title>
  <meta name="description" content="Sign in to the Promax Incident Monitoring Dashboard." />
  <link rel="icon" type="image/webp"
    href="https://techbridgeconsultancy.com/wp-content/uploads/2026/08/cropped-TBCLOGOS-02-3-1-120x73.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 14px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #070b14;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59, 130, 246, 0.13), transparent),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(124, 58, 237, 0.10), transparent);
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(59, 130, 246, 0.08);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: rgba(124, 58, 237, 0.08);
      bottom: -80px;
      right: -80px;
      animation-delay: -4s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-30px) scale(1.05);
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: 20px;
      background: rgba(13, 19, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 44px 40px 40px;
      box-shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(59, 130, 246, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: card-enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes card-enter {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-img {
      height: 44px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
    }

    .logo-title {
      margin-top: 14px;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #f1f5f9;
      line-height: 1.2;
    }

    .logo-sub {
      margin-top: 5px;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #475569;
      pointer-events: none;
      transition: color 0.18s;
      display: flex;
    }

    .form-input {
      width: 100%;
      height: 46px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #1e2a42;
      border-radius: 10px;
      color: #f1f5f9;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0 14px 0 42px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .input-wrap:focus-within .input-icon {
      color: #3b82f6;
    }

    .form-input::placeholder {
      color: #334155;
    }

    .pwd-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: #475569;
      display: flex;
      padding: 4px;
      transition: color 0.15s;
    }

    .pwd-toggle:hover {
      color: #94a3b8;
    }

    .error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.83rem;
      color: #f87171;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .error-msg.show {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-submit .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-submit.loading .spinner {
      display: block;
    }

    .btn-submit.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .divider {
      text-align: center;
      position: relative;
      margin: 24px 0 16px;
      color: #334155;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: calc(50% - 40px);
      height: 1px;
      background: #1e2a42;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .hint-box {
      background: rgba(59, 130, 246, 0.06);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    .hint-box strong {
      color: #60a5fa;
    }

    .card-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.74rem;
      color: #334155;
    }
  </style>
</head>

<body>
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="card" role="main">
    <div class="logo-wrap">
      <img id="brandLogo" src="https://techbridgeconsultancy.com/wp-content/uploads/2026/04/logo-1.webp"
        alt="Promax Logo" class="logo-img" />
      <div class="logo-title">Promax Monitor</div>
      <div class="logo-sub">Incident Management Dashboard</div>
    </div>
    <form id="loginForm" onsubmit="doLogin(event)" novalidate>
      <div class="error-msg" id="errorMsg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span id="errorText">Invalid username or password.</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username"
            autocomplete="username" required autofocus />
          <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg></span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password"
            autocomplete="current-password" required />
          <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg></span>
          <button type="button" class="pwd-toggle" id="pwdToggle" onclick="togglePwd()" title="Show/hide password"
            aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">
        <div class="spinner"></div>
        <span class="btn-text">Sign In</span>
      </button>
    </form>

    <div class="card-footer">Promax Incident Management &nbsp;&middot;&nbsp; v2.2</div>
  </div>
  <script>
    function togglePwd() {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        inp.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }
    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorMsg');
      const errText = document.getElementById('errorText');
      errEl.classList.remove('show');
      btn.classList.add('loading'); btn.disabled = true;
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (res.ok && data.ok) { window.location.href = '/'; }
        else { errText.textContent = data.error || 'Invalid username or password.'; errEl.classList.add('show'); document.getElementById('password').value = ''; }
      } catch (err) {
        errText.textContent = 'Cannot connect to server. Please try again.'; errEl.classList.add('show');
      } finally { btn.classList.remove('loading'); btn.disabled = false; }
    }
    (async () => {
      try {
        const res = await fetch('/api/auth-check');
        if (res.ok) { const d = await res.json(); if (d.authenticated) window.location.href = '/'; }
      } catch (_) { }
    })();
  </script>
</body>

</html>
