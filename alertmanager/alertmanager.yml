global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
    - instance
    - severity

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 5m

  receiver: alert-action-warning

  routes:
    - matchers:
        - severity="critical"
      receiver: alert-action-critical

receivers:

  - name: alert-action-warning
    webhook_configs:
      - url: 'http://host.docker.internal:5000/alertmanager'
        send_resolved: true

  - name: alert-action-critical
    webhook_configs:
      - url: 'http://host.docker.internal:5000/alertmanager'
        send_resolved: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'
